<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แอพบันทึกรายรับรายจ่าย</title>

  <!-- Chart.js สำหรับกราฟ -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- เชื่อม Manifest (PWA) -->
  <link rel="manifest" href="manifest.json">

  <!-- เชื่อม CSS -->
  <link rel="stylesheet" href="styles.css">

</head>
<body>

  <!-- 🔥 ส่วนหัว -->
  <header>
    <h1>แอพบันทึกรายรับรายจ่าย</h1>
    <button id="toggleDark">🌙</button>
  </header>

  <!-- 🏠 หน้าแดชบอร์ด -->
  <section id="dashboard">
    <h2>แดชบอร์ด</h2>
    <p>ยอดรวมทั้งหมด: ฿<span id="totalAmount">0</span></p>
    <canvas id="summaryChart" width="400" height="200"></canvas>
  </section>

  <!-- ➕ ฟอร์มบันทึก -->
  <section id="addData">
    <h2>บันทึกข้อมูล</h2>
    <form id="recordForm">
      <input type="text" id="title" placeholder="ชื่อรายการ" required>
      <input type="number" id="amount" placeholder="จำนวนเงิน" required>
      <select id="category">
        <option value="income">รายรับ</option>
        <option value="expense">รายจ่าย</option>
      </select>
      <button type="submit">บันทึก</button>
    </form>
  </section>

  <!-- 📝 รายการทั้งหมด -->
  <section id="recordsList">
    <h2>ประวัติ</h2>
    <ul id="records"></ul>
  </section>

  <!-- 🟢 เมนูไอคอนล่าง (เหมือนแอพมือถือ) -->
  <nav class="bottom-nav">
    <button onclick="showSection('dashboard')">🏠 หน้าแรก</button>
    <button onclick="showSection('addData')">➕ บันทึก</button>
    <button onclick="showSection('recordsList')">📋 ประวัติ</button>
  </nav>

  <!-- 🔥 เชื่อม JS -->
  <script src="app.js"></script>
</body>
</html>
