<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyFinance App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 🔥 ส่วนหัว -->
  <header>
    <h1>MyFinance</h1>
    <button id="darkModeToggle">🌙</button>
  </header>

  <!-- 🟢 หน้าแดชบอร์ด -->
  <main id="dashboard" class="active">
    <h2>ยอดคงเหลือ</h2>
    <p id="balance">฿0</p>
    <canvas id="chart" width="300" height="300"></canvas>
  </main>

  <!-- ➕ หน้าเพิ่มข้อมูล -->
  <main id="addRecord">
    <h2>เพิ่มรายการ</h2>
    <form id="recordForm">
      <input type="text" id="title" placeholder="ชื่อรายการ" required>
      <input type="number" id="amount" placeholder="จำนวนเงิน" required>
      <select id="type">
        <option value="income">รายรับ</option>
        <option value="expense">รายจ่าย</option>
      </select>
      <button type="submit">บันทึก</button>
    </form>
  </main>

  <!-- 📝 หน้าแจ้งเตือน -->
  <main id="notifications">
    <h2>แจ้งเตือน</h2>
    <p>ยังไม่มีแจ้งเตือน</p>
  </main>

  <!-- ⚙️ หน้าตั้งค่า -->
  <main id="settings">
    <h2>ตั้งค่า</h2>
    <p>Coming Soon!</p>
  </main>

  <!-- 🔵 เมนูไอคอนล่าง -->
  <nav>
    <button onclick="showPage('dashboard')">🏠</button>
    <button onclick="showPage('addRecord')">➕</button>
    <button onclick="showPage('notifications')">🔔</button>
    <button onclick="showPage('settings')">⚙️</button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
