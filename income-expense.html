<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyFinance - Transactions</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-logo">MyFinance</div>
    <ul class="navbar-links">
      <li><a href="index.html">Dashboard</a></li>
      <li><a href="income-expense.html">Transactions</a></li>
      <li><a href="graph.html">Graphs</a></li>
      <li><a href="category.html">Categories</a></li>
      <li><a href="reset.html">Reset</a></li>
    </ul>
  </nav>

  <!-- Content -->
  <div class="container">
    <h1>Transactions</h1>

    <!-- Form -->
    <form id="transaction-form">
      <label for="type">Type:</label>
      <select id="type" required>
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>

      <label for="category">Category:</label>
      <input type="text" id="category" placeholder="e.g. Salary, Food" required>

      <label for="amount">Amount:</label>
      <input type="number" id="amount" placeholder="e.g. 100" required>

      <button type="submit">Add Transaction</button>
    </form>

    <!-- Transaction Table -->
    <table id="transaction-table">
      <thead>
        <tr>
          <th>Type</th>
          <th>Category</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody>
        <!-- Transactions will appear here -->
      </tbody>
    </table>

  </div>

  <script src="assets/js/income-expense.js"></script>
</body>
</html>
